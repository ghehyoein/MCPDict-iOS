name: Dispatch complete performance release validation
on:
  push:
    branches: [codex/performance-release-actions]
permissions:
  actions: write
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - name: Check candidate and start the ten-device-system matrix
        run: |
          test "$(gh api repos/ghehyoein/MCPDict-iOS/commits/codex/performance-selection-tables --jq .sha)" = ea960df495489316282b62fdf017d68ef92802c0
          gh workflow run ios.yml --ref codex/performance-selection-tables
