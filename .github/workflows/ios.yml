name: Diagnose iPadOS 26 menu and reset interactions
on:
  push:
    branches: [codex/diagnose-dense-map]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixture build
        run: |
          mkdir -p App/BundledTables
          brew install xcodegen
          python3 tools/prepare_assets.py
          xcodegen generate
      - name: Repeat menu and reset checks with main-thread samples
        run: |
          device=$(xcrun simctl create iPad26Diagnosis com.apple.CoreSimulator.SimDeviceType.iPad-9th-generation com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          python3 tools/diagnose_map.py "$device" &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          xcodebuild -project MCPDictIOS.xcodeproj -scheme MCPDictIOS -destination "platform=iOS Simulator,id=$device" -derivedDataPath DerivedData -resultBundlePath TestResults -test-iterations 3 -only-testing:MCPDictIOSUITests/NavigationTests/testDenseMapMenuRemainsInteractiveAfterLoading -only-testing:MCPDictIOSUITests/NavigationTests/testThreeIndependentFontSliders CODE_SIGNING_ALLOWED=NO test
      - name: Export diagnostic samples and screenshots
        if: always()
        run: |
          python3 - <<'PYLOG'
          from pathlib import Path
          for path in sorted(Path('.').glob('dense-sample-*.txt')):
              print(path.name)
              print("\n".join(path.read_text().splitlines()[:175]))
          PYLOG
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad26-interaction-diagnostics
          path: |
            dense-*.txt
            dense-*.png
            TestAttachments
