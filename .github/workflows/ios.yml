name: Dispatch performance release validation
on:
  push:
    branches: [codex/performance-release-actions]
permissions:
  actions: write
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - name: Start the existing ten-combination validation matrix
        run: gh workflow run ios.yml --ref codex/performance-selection-tables
