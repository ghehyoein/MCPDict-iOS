name: Run final 0.9.3 device matrix
on:
  push:
    branches: [codex/performance-release-actions]
permissions:
  actions: write
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - name: Verify candidate commit and dispatch complete simulator matrix
        run: |
          test "$(gh api repos/ghehyoein/MCPDict-iOS/commits/codex/performance-selection-tables --jq .sha)" = 327c0328e2c68281acb506c47f223ac49551bbb9
          gh workflow run ios.yml --ref codex/performance-selection-tables
