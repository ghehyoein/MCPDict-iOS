name: Inspect iOS 18 reset termination
on:
  push:
    branches: [codex/performance-release-actions]
permissions:
  actions: read
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - uses: actions/checkout@v4
      - name: Export reset crash evidence
        run: |
          gh run download 42458656173 --name simulator-test-results-iPhone-16-Pro-Max-18.5 --dir download
          find download -type f | head -100 || true
          mkdir evidence
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          for p in Path('download').rglob('*'):
              if p.is_file() and p.suffix in {'.json','.txt','.png','.ips','.crash','.zip','.gz','.log'}:
                  shutil.copy2(p, Path('evidence') / p.name)
          PYCODE
          cd evidence
          git init -b codex/performance-093-crash-review
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'iOS 18 reset crash evidence'
          git remote add origin https://github.com/ghehyoein/MCPDict-iOS.git
          git -c http.https://github.com/.extraheader="$(git -C .. config http.https://github.com/.extraheader)" push origin HEAD:refs/heads/codex/performance-093-crash-review
