name: Check iOS and Python
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: Optional space-separated Xcode test identifiers for focused checks
        type: string
        default: ''
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.device }} / iOS ${{ matrix.ios }}
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone-13]
        ios: ['26.2']
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python data contract tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: osfans/MCPDict
          ref: 911a151d9d19ffaf637d3695a4669516957a1c50
          path: bundled-source
      - name: Build complete bundled dictionary snapshot
        run: |
          python3 -m venv bundle-env
          bundle-env/bin/pip install regex==2026.9.29
          bundle-env/bin/python tools/bundle_tables.py bundled-source App/BundledTables
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          python3 tools/prepare_assets.py
          xcodegen generate
      - name: Compile for iOS Simulator without signing
        run: xcodebuild -project MCPDictIOS.xcodeproj -scheme MCPDictIOS -sdk iphonesimulator -configuration Debug -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Test SQLite queries and failed update rollback in Simulator
        env:
          DEVICE_TYPE: ${{ matrix.device }}
          IOS_VERSION: ${{ matrix.ios }}
          TEST_FILTER: ${{ inputs.tests }}
        run: |
          args=()
          read -ra tests <<< "$TEST_FILTER"
          for test in "${tests[@]}"; do
            [[ "$test" =~ ^MCPDictIOS(UI)?Tests/[A-Za-z0-9_/]+$ ]] || exit 1
            args+=("-only-testing:$test")
          done
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
          device=$(xcrun simctl create "MCPDict-${DEVICE_TYPE}-${IOS_VERSION}" "com.apple.CoreSimulator.SimDeviceType.${DEVICE_TYPE}" "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl list devices | tee tested-device.txt
          xcodebuild -project MCPDictIOS.xcodeproj -scheme MCPDictIOS -destination "platform=iOS Simulator,id=$device" -derivedDataPath DerivedData -resultBundlePath TestResults CODE_SIGNING_ALLOWED=NO "${args[@]}" test
      - name: Export test diagnostics and screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            mkdir -p TestAttachments
            xcrun xcresulttool get test-results tests --path TestResults.xcresult > TestAttachments/tests.json
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-test-results-${{ matrix.device }}-${{ matrix.ios }}
          path: |
            tested-device.txt
            TestResults.xcresult
            TestAttachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots-${{ matrix.device }}-${{ matrix.ios }}
          path: |
            TestAttachments/**/*.png
            TestAttachments/**/*.jpg
            TestAttachments/**/*.json
