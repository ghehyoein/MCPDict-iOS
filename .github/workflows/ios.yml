name: Build 0.9.3 IPA behind the existing regression gate
on:
  push:
    branches: [codex/performance-release-actions]
permissions:
  actions: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - name: Verify candidate and targeted checks before starting the gated build
        run: |
          test "$(gh api repos/ghehyoein/MCPDict-iOS/commits/codex/performance-selection-tables --jq .sha)" = 7901d90264cb772f87d25a7002fb360d833cba45
          test "$(gh run view 42462394616 --json headSha --jq .headSha)" = 7901d90264cb772f87d25a7002fb360d833cba45
          test "$(gh run view 42460544856 --json conclusion --jq .conclusion)" = success
          gh workflow run device.yml --ref codex/performance-selection-tables -f publish=true
