name: Export device validation screenshots
on:
  push:
    branches: [codex/performance-release-actions]
permissions:
  actions: read
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - uses: actions/checkout@v4
      - name: Download small-screen and tablet screenshots
        run: |
          mkdir -p /tmp/device-images
          gh run download 42444678770 -n simulator-screenshots-iPhone-SE-3rd-generation-18.5 -D /tmp/device-images/se
          gh run download 42444678770 -n simulator-screenshots-iPad-9th-generation-18.5 -D /tmp/device-images/ipad
          git switch --orphan codex/device-validation-images
          git rm -rf .
          cp -R /tmp/device-images/* .
          git add se ipad
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -m 'Export simulator diagnostics for device coverage review'
          git push origin HEAD:refs/heads/codex/device-validation-images
