name: Verify published 0.9.3 IPA
on:
  push:
    branches: [codex/performance-release-actions]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7901d90264cb772f87d25a7002fb360d833cba45
      - name: Download published assets and verify device IPA
        run: |
          gh release view iphone-dev-67-5ecd9cd --json tagName,targetCommitish,isDraft,isPrerelease,url
          gh release download iphone-dev-67-5ecd9cd --pattern '*.ipa' --pattern '*.json' --pattern '*.sha256' --dir release-verify
          python3 - <<'PYCODE'
          from pathlib import Path
          import urllib.request, sys, hashlib, json, plistlib, zipfile
          sys.path.insert(0, 'tools')
          from package_ipa import validate_device_binary
          build = '67'
          root = Path('release-verify')
          report = json.loads((root / 'MCPDict-iPhone-unsigned.json').read_text())
          ipa = root / 'MCPDict-iPhone-unsigned.ipa'
          with ipa.open('rb') as stream: digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert digest == report['sha256'] == (root / 'MCPDict-iPhone-unsigned.sha256').read_text().split()[0]
          assert report['version'] == '0.9.3' and report['build'] == build
          assert report['platform'] == 'iPhoneOS' and report['architecture'] == 'arm64'
          assert report['size'] == ipa.stat().st_size
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              info_path = next(n for n in z.namelist() if n.count('/') == 2 and n.endswith('/Info.plist'))
              info = plistlib.loads(z.read(info_path))
              assert info['CFBundleShortVersionString'] == '0.9.3' and info['CFBundleVersion'] == build
              assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS']
              assert set(info['UIDeviceFamily']) == {1, 2}
              app = info_path.rsplit('/', 1)[0]
              executable = root / 'verified-device-executable'
              executable.write_bytes(z.read(app + '/' + info['CFBundleExecutable']))
              validate_device_binary(executable)
          print(json.dumps(report, ensure_ascii=False))
          PYCODE
