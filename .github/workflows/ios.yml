name: Cancel user-approved obsolete test runs
on:
  push:
    branches: [codex/cancel-obsolete-performance-runs]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - name: Cancel only the three approved obsolete runs
        run: |
          for run in 42436228944 42436553330 42438911523; do
            state=$(gh run view "$run" --json status --jq .status)
            if [ "$state" != "completed" ]; then
              gh run cancel "$run"
            fi
          done
