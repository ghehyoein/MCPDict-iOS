name: Inspect final full-screen and Home-button iPads
on:
  push:
    branches: [codex/performance-release-actions]
permissions:
  actions: read
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - uses: actions/checkout@v4
      - name: Export both iPad interface screenshots
        run: |
          gh run download 42462394616 --name simulator-screenshots-iPad-9th-generation-26.2 --dir download/home
          gh run download 42462394616 --name simulator-screenshots-iPad-Air-11-inch-M3-26.2 --dir download/full
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          for kind in ['home','full']:
              target=Path('evidence') / kind
              target.mkdir(parents=True)
              for path in (Path('download') / kind).rglob('*'):
                  if path.is_file() and path.suffix in {'.png','.jpg','.json'}:
                      shutil.copy2(path, target / path.name)
          PYCODE
          cd evidence
          git init -b codex/performance-093-final-ipads-review
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Final full-screen and Home-button iPad interface verification'
          git remote add origin https://github.com/ghehyoein/MCPDict-iOS.git
          git -c http.https://github.com/.extraheader="$(git -C .. config http.https://github.com/.extraheader)" push origin HEAD:refs/heads/codex/performance-093-final-ipads-review
