name: Validate and publish authorized 0.9.4
on:
  push:
    branches: [codex/performance-release-actions]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - name: Check target commit and start focused validation and gated release
        run: |
          test "$(gh api repos/ghehyoein/MCPDict-iOS/commits/main --jq .sha)" = 8b4a1f75716fc72d9648012ebcf1bb0abf6027c5
          gh workflow run ios.yml --ref main -f tests='MCPDictIOSTests/CatalogRefreshTests MCPDictIOSTests/OptimizationTests/testUnchangedCatalogOnlyRequestsHead MCPDictIOSUITests/NavigationTests/testCatalogProgressAllowsNavigation'
          gh workflow run device.yml --ref main -f publish=true
