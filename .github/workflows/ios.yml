{
  "name": "Export three historical dictionary icons",
  "on": {
    "push": {
      "branches": [
        "codex/performance-release-actions"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "export": {
      "runs-on": "macos-15",
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_26.3.app/Contents/Developer"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Render public icon code only",
          "run": "set -euo pipefail\nmkdir -p Export.app output\nSDK=$(xcrun --sdk iphonesimulator --show-sdk-path)\nxcrun swiftc icon-export.swift -sdk \"$SDK\" -target arm64-apple-ios18.0-simulator -o Export.app/Export\ncat > Export.app/Info.plist <<'PLIST'\n<?xml version=\"1.0\" encoding=\"UTF-8\"?><plist version=\"1.0\"><dict><key>CFBundleIdentifier</key><string>org.mcpdict.iconexport</string><key>CFBundleExecutable</key><string>Export</string><key>CFBundleName</key><string>Export</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleVersion</key><string>1</string><key>CFBundleShortVersionString</key><string>1</string><key>LSRequiresIPhoneOS</key><true/></dict></plist>\nPLIST\ncodesign --force --sign - Export.app\nDEVICE=$(xcrun simctl create IconExport com.apple.CoreSimulator.SimDeviceType.iPhone-13 com.apple.CoreSimulator.SimRuntime.iOS-26-2)\nxcrun simctl boot \"$DEVICE\"\nxcrun simctl bootstatus \"$DEVICE\" -b\nxcrun simctl install \"$DEVICE\" Export.app\nxcrun simctl launch \"$DEVICE\" org.mcpdict.iconexport\nDIR=$(xcrun simctl get_app_container \"$DEVICE\" org.mcpdict.iconexport data)\nfor i in {1..30}; do test -f \"$DIR/Documents/done\" && break; sleep 1; done\ncp \"$DIR\"/Documents/*.png output/\npython3 - <<'PYTHON'\nimport pathlib,base64\nfor p in sorted(pathlib.Path('output').glob('*.png')):\n print('ICON_FILE:'+p.name+':'+base64.b64encode(p.read_bytes()).decode())\nPYTHON\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "dictionary-icons-three-versions",
            "path": "output/*.png"
          }
        }
      ]
    }
  }
}
