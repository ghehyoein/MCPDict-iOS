name: Diagnose dense map
on:
  push:
    branches: [codex/diagnose-dense-map]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixture build
        run: |
          mkdir -p App/BundledTables
          brew install xcodegen
          python3 tools/prepare_assets.py
          xcodegen generate
      - name: Run dense map with main-thread sampling
        run: |
          device=$(xcrun simctl create DenseMap com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          python3 tools/diagnose_map.py "$device" &
          xcodebuild -project MCPDictIOS.xcodeproj -scheme MCPDictIOS -destination "platform=iOS Simulator,id=$device" -derivedDataPath DerivedData -resultBundlePath TestResults -only-testing:MCPDictIOSUITests/NavigationTests/testDenseMapMenuRemainsInteractiveAfterLoading CODE_SIGNING_ALLOWED=NO test
      - name: Export samples
        if: always()
        run: |
          python3 - <<'PYLOG'
          from pathlib import Path
          for path in sorted(Path('.').glob('dense-sample-*.txt')):
              lines=path.read_text().splitlines()
              print(path.name)
              for line in lines[:240]: print(line)
          PYLOG
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dense-map-diagnostics
          path: |
            dense-*.txt
            dense-*.png
            TestAttachments
