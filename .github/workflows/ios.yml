{
  "name": "Publish authorized 0.9.5 after focused checks",
  "on": {
    "push": {
      "branches": [
        "codex/performance-release-actions"
      ]
    }
  },
  "permissions": {
    "actions": "write",
    "contents": "read"
  },
  "jobs": {
    "dispatch": {
      "runs-on": "ubuntu-latest",
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "GH_REPO": "ghehyoein/MCPDict-iOS"
      },
      "steps": [
        {
          "name": "Validate target and dispatch gated publication",
          "run": "test \"$(gh api repos/ghehyoein/MCPDict-iOS/commits/main --jq .sha)\" = 3ef91abdafbaec2543f9c93b4e7d3b7de735aaa7\ngh workflow run ios.yml --ref main -f tests='MCPDictIOSTests/BundledTablesTests/testUpgradeSynchronizesHistoricalArchivesWithoutRestoringRemovedTables MCPDictIOSTests/BundledTablesTests/testUpgradePreservesManuallyRefreshedArchives MCPDictIOSTests/CatalogRefreshTests/testRefreshSynchronizesArchivesButPreservesReadingsAndDownloadIdentity MCPDictIOSTests/CatalogRefreshTests/testPackagedArchivesContainHistoricalGrayMarkers MCPDictIOSTests/PresentationRevisionTests/testHistoricalFlagReadsGrayMarkerRatherThanTransitionOrCategory MCPDictIOSTests/RequestedChangesTests/testDictionaryTabLoadsApprovedArtworkAtOriginalSize MCPDictIOSTests/RequestedChangesTests/testOnlyMarkedHistoricalColorMatchesAndRootCategoryDoesNot'\ngh workflow run device.yml --ref main -f publish=true\n"
        }
      ]
    }
  }
}
