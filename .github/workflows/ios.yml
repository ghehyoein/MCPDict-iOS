name: Dispatch final iPad handoff validation
on:
  push:
    branches: [codex/performance-release-actions]
permissions:
  actions: write
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - name: Check candidate and start ten device and system combinations
        run: |
          test "$(gh api repos/ghehyoein/MCPDict-iOS/commits/codex/performance-selection-tables --jq .sha)" = 57ce732b18284a0656a7c1e911216944665ca449
          gh workflow run ios.yml --ref codex/performance-selection-tables
