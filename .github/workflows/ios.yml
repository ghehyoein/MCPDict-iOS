name: Diagnose device coverage
on:
  push:
    branches: [codex/diagnose-dense-map]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone-SE-3rd-generation, iPhone-16-Pro-Max, iPad-9th-generation]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixture build
        run: |
          mkdir -p App/BundledTables
          brew install xcodegen
          python3 tools/prepare_assets.py
          xcodegen generate
      - name: Test device navigation and retained data
        env:
          DEVICE_TYPE: ${{ matrix.device }}
        run: |
          device=$(xcrun simctl create DeviceCoverage "com.apple.CoreSimulator.SimDeviceType.${DEVICE_TYPE}" com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project MCPDictIOS.xcodeproj -scheme MCPDictIOS -destination "platform=iOS Simulator,id=$device" -derivedDataPath DerivedData -resultBundlePath TestResults -only-testing:MCPDictIOSTests/OptimizationTests -only-testing:MCPDictIOSUITests/NavigationTests/testDenseMapMenuRemainsInteractiveAfterLoading -only-testing:MCPDictIOSUITests/NavigationTests/testPinnedHeaderPreservesInputAndLanguageMenu -only-testing:MCPDictIOSUITests/NavigationTests/testMapModesRefreshOpenDropdownAndSelectableText -only-testing:MCPDictIOSUITests/NavigationTests/testTreeSelectionBlankStartAndSettings -only-testing:MCPDictIOSUITests/NavigationTests/testDownloadsPushAndReferenceOptionsSheet CODE_SIGNING_ALLOWED=NO test
      - name: Export evidence
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-diagnostics-${{ matrix.device }}
          path: TestAttachments
