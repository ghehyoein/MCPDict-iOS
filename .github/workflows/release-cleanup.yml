name: Publish verified build and clean historical releases
on:
  push:
    paths: ['.github/workflows/release-cleanup.yml']
permissions:
  contents: write
  actions: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
    steps:
      - uses: actions/checkout@v4
      - name: Require passing application checks
        run: gh run watch 42065401362 --exit-status --interval 20
      - name: Retrieve verified build
        run: |
          gh run download 42065401409 --name iPhone-IPA-requires-local-signing --dir dist
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path("dist/MCPDict-iPhone-unsigned.ipa")
          report=json.loads(p.with_suffix(".json").read_text())
          assert report["version"]=="0.6.1" and report["build"]=="20"
          assert hashlib.sha256(p.read_bytes()).hexdigest()==report["sha256"]
          PY
      - name: Publish latest build
        run: |
          tag=iphone-dev-20-54bbfcd
          RELEASE_TAG="$tag" python3 tools/carry_diagnostics.py
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            gh release create "$tag" --latest --title "iPhone development build 20 — local signing required" --notes-file INSTALL-IPHONE.md --target 478199e3ae365b66c9ffdb9db542d6bd2a5c3054 && break
            sleep 10
          done
          gh release upload "$tag" dist/* --clobber
      - name: Remove explicitly requested historical releases
        run: |
          for id in 434966767 435372842 434978416 434978370 435426888; do
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
          done
