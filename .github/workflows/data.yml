name: Build dictionary from GitHub source
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Update release diagnostics after user approval
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/data.yml'
      - 'tools/data_pipeline.py'
      - 'tools/requirements-build.txt'
permissions:
  contents: write
concurrency:
  group: dictionary-release
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve immutable upstream commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git ls-remote https://github.com/osfans/MCPDict.git refs/heads/master | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release download --pattern diagnostics.json --dir prior; then
            previous=$(python -c 'import json; print(json.load(open("prior/diagnostics.json"))["sourceCommit"])')
            profile=$(python -c 'import json; print(json.load(open("prior/diagnostics.json")).get("diagnosticsProfile", ""))')
            if [ "$sha" = "$previous" ] && [ "$profile" = "upstream-c-v1" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/checkout@v4
        if: steps.source.outputs.skip != 'true'
        with:
          repository: osfans/MCPDict
          ref: ${{ steps.source.outputs.sha }}
          path: data-build/upstream
      - name: Build, validate and package without APK
        if: steps.source.outputs.skip != 'true'
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          PYTHONUTF8: '1'
        run: |
          python -m pip install -r tools/requirements-build.txt
          python -m unittest discover -s tools -p 'test_*.py' -v
          python tools/data_pipeline.py --checkout data-build/upstream --repository "$RELEASE_REPOSITORY"
          cp data-build/upstream/LICENSE dist/UPSTREAM-LICENSE.txt
          cp data-build/upstream/tools/warnings.txt dist/upstream-warnings.txt
      - name: Update diagnostics in the current app release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && steps.source.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          python - <<'PY'
          import json, os
          from pathlib import Path
          source=json.loads(Path("dist/manifest.json").read_text())["sourceCommit"]
          url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}/upstream-warnings.txt"
          Path("dist/diagnostics.json").write_text(json.dumps({"sourceCommit":source,"diagnosticsProfile":"upstream-c-v1","diagnosticsURL":url}))
          PY
          gh release upload "$RELEASE_TAG" dist/upstream-warnings.txt dist/diagnostics.json --clobber
