name: Build dictionary from GitHub source
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dictionary-release
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve immutable upstream commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git ls-remote https://github.com/osfans/MCPDict.git refs/heads/master | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release download data-latest --pattern manifest.json --dir prior; then
            previous=$(python -c 'import json; print(json.load(open("prior/manifest.json"))["sourceCommit"])')
            if [ "$sha" = "$previous" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/checkout@v4
        if: steps.source.outputs.skip != 'true'
        with:
          repository: osfans/MCPDict
          ref: ${{ steps.source.outputs.sha }}
          path: data-build/upstream
      - name: Build, validate and package without APK
        if: steps.source.outputs.skip != 'true'
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          PYTHONUTF8: '1'
        run: |
          python -m pip install -r tools/requirements-build.txt
          python -m unittest discover -s tools -p 'test_*.py' -v
          python tools/data_pipeline.py --checkout data-build/upstream --repository "$RELEASE_REPOSITORY"
          cp data-build/upstream/LICENSE dist/UPSTREAM-LICENSE.txt
          cp data-build/upstream/tools/warnings.txt dist/upstream-warnings.txt
      - name: Publish validated immutable data, then update discovery manifest
        if: steps.source.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c 'import json; print(json.load(open("dist/manifest.json"))["version"])')
          if ! gh release view "$tag"; then
            gh release create "$tag" dist/mcpdict.db dist/manifest.json dist/validation.json dist/UPSTREAM-LICENSE.txt dist/upstream-warnings.txt --title "$tag" --notes "Built directly from osfans/MCPDict source tables. See manifest.json for source SHA and checksum; upstream-warnings.txt contains source-data diagnostics."
          fi
          if ! gh release view data-latest; then
            gh release create data-latest --title 'Dictionary update manifest' --notes 'Discovery manifest. Database URLs point to immutable releases.'
          fi
          gh release upload data-latest dist/manifest.json --clobber
