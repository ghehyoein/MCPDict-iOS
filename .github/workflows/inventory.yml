name: Revision 0.9.2 native switch touch verification
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: read
jobs:
  focus:
    runs-on: macos-15
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/revision-092
      - name: Generate project
        run: |
          mkdir -p App/BundledTables
          brew install xcodegen
          python3 tools/prepare_assets.py
          xcodegen generate
      - name: Repeat a single 200 ms native switch touch on iOS 26.2
        run: |
          for runtime in 26-2; do
            device=$(xcrun simctl create "MCPDict-focus-$runtime" com.apple.CoreSimulator.SimDeviceType.iPhone-13 "com.apple.CoreSimulator.SimRuntime.iOS-$runtime")
            xcodebuild -project MCPDictIOS.xcodeproj -scheme MCPDictIOS -destination "platform=iOS Simulator,id=$device" -derivedDataPath DerivedData -resultBundlePath "Focus-$runtime" CODE_SIGNING_ALLOWED=NO -only-testing:MCPDictIOSUITests/NavigationTests/testSharedLanguageStateAndIndependentDownloads -test-iterations 5 test
          done
      - name: Export diagnostics
        if: always()
        run: |
          for result in Focus-*.xcresult; do
            test -d "$result" || continue
            xcrun xcresulttool export attachments --path "$result" --output-path "Attachments-$result"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-interaction-results
          path: |
            Focus-*.xcresult
            Attachments-*
