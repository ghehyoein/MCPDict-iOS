name: Publish verified 0.9.2 upon explicit user request
on:
  push:
    branches: [codex/publish-092]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghehyoein/MCPDict-iOS
      EXPECTED_SHA: 069e15b5e681c4604cc1950ac31cafa424acdcf1
    steps:
      - name: Queue device build with the repository mandatory simulator release gate
        run: |
          test "$(gh api repos/$GH_REPO/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_SHA"
          run=$(gh run view 42390732849 --json headSha,status,conclusion)
          test "$(echo "$run" | jq -r .headSha)" = "$EXPECTED_SHA"
          test "$(echo "$run" | jq -r .status)" = completed
          test "$(echo "$run" | jq -r .conclusion)" = success
          # device.yml repeats the exact-commit simulator gate before publication.
          gh workflow run device.yml --ref main -f publish=true
