name: Build iPhone IPA for local signing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'project.yml'
      - 'tools/package_ipa.py'
      - 'tools/prepare_assets.py'
      - 'tools/AppIcon.png'
      - '.github/workflows/device.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: device-release
  cancel-in-progress: true
jobs:
  device:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test package and query contracts
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Generate assets and project
        run: |
          brew install xcodegen
          python tools/prepare_assets.py
          xcodegen generate
      - name: Build for physical iPhone without account credentials
        run: xcodebuild -project MCPDictIOS.xcodeproj -scheme MCPDictIOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DeviceBuild CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify device platform and package IPA
        run: python tools/package_ipa.py DeviceBuild/Build/Products/Release-iphoneos/MCPDictIOS.app dist/MCPDict-iPhone-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone-IPA-requires-local-signing
          path: dist/*
      - name: Require simulator regression tests before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            run=$(gh run list --workflow ios.yml --commit "$GITHUB_SHA" --json databaseId,status,conclusion --limit 1)
            status=$(echo "$run" | jq -r '.[0].status // "waiting"')
            if [ "$status" = "completed" ]; then
              test "$(echo "$run" | jq -r '.[0].conclusion')" = "success"
              exit $?
            fi
            sleep 10
          done
          echo "Simulator checks did not complete; keeping the previous release."
          exit 1
      - name: Publish downloadable development IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="iphone-dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          RELEASE_TAG="$tag" python tools/carry_diagnostics.py
          previous=$(gh release view --json tagName --jq .tagName)
          gh release create "$tag" dist/* --latest --title "iPhone development build ${GITHUB_RUN_NUMBER} — local signing required" --notes-file INSTALL-IPHONE.md --target "$GITHUB_SHA"
          if [ -n "$previous" ] && [ "$previous" != "$tag" ]; then gh release delete "$previous" --yes; fi


