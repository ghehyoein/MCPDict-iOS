name: Publish experimental downloadable tables
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_table_catalog.py', '.github/workflows/tables.yml']
permissions:
  contents: write
concurrency:
  group: table-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download source-built full database from own release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-latest --pattern manifest.json --dir source-data
          tag=$(python -c 'import json; print(json.load(open("source-data/manifest.json"))["version"])')
          gh release download "$tag" --pattern mcpdict.db --dir source-data
          python -c 'import json,hashlib,pathlib; m=json.load(open("source-data/manifest.json")); p=pathlib.Path("source-data/mcpdict.db"); assert p.stat().st_size == m["database"]["size"]; assert hashlib.file_digest(p.open("rb"),"sha256").hexdigest() == m["database"]["sha256"]'
      - name: Build three independent experimental packages
        run: |
          commit=$(python -c 'import json; print(json.load(open("source-data/manifest.json"))["sourceCommit"])')
          python tools/build_table_catalog.py --database source-data/mcpdict.db --output table-data --repository "$GITHUB_REPOSITORY" --commit "$commit" --tag "tables-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
      - name: Publish packages then catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c 'import json; print(json.load(open("table-data/catalog.json"))["version"])')
          gh release create "$tag" table-data/* --prerelease --title 'Experimental tables: 普通話 / 廣州 / 杭州' --notes 'Source-built independent tables; shared Hanzi/character-reference database not included. Classification comes from upstream info records.' --target "$GITHUB_SHA"
          if ! gh release view tables-latest; then
            gh release create tables-latest --prerelease --title 'Experimental table catalog' --notes 'Catalog only; packages are stored at immutable release URLs.'
          fi
          gh release upload tables-latest table-data/catalog.json --clobber
