name: MCPDictIOS
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MCPDictIOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [BundledTables]
      - path: App/BundledTables
        type: folder
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        LSApplicationQueriesSchemes: [maps, iosamap, baidumap, comgooglemaps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ghehyoein.MCPDictIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 汉字音典
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.9.1"
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - sdk: libsqlite3.tbd
  MCPDictIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MCPDictIOS
      - sdk: libsqlite3.tbd
  MCPDictIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MCPDictIOS
schemes:
  MCPDictIOS:
    build:
      targets:
        MCPDictIOS: all
    test:
      targets: [MCPDictIOSTests, MCPDictIOSUITests]
